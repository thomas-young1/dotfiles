[tools]
bun = "1.1.43"
fzf = "0.57.0"
go = "1.26.3"
jq = "1.7.1"
just = "1.47.0"
node = "22.13.0"
pnpm = "10.12.1"
python = "3.12.6"
ripgrep = "14.1.1"
uv = "0.5.20"

[bootstrap.packages]
"brew:fish" = "latest"
"brew:gh" = "latest"
"brew:git" = "latest"
"brew:git-delta" = "latest"
"brew:gnupg" = "latest"
"brew:lazygit" = "latest"
"brew:neovim" = "latest"
"brew:wget" = "latest"
"brew-cask:1password" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:raycast" = "latest"
"brew-cask:zed" = "latest"

[dotfiles]
"~/.hushlogin" = "~/.dotfiles/.hushlogin"
"~/.config/fish" = "~/.dotfiles/fish"
"~/.config/gh/config.yml" = "~/.dotfiles/gh/config.yml"
"~/.config/ghostty/config" = "~/.dotfiles/ghostty/config"
"~/.config/lazygit/config.yml" = "~/.dotfiles/lazygit/config.yml"
"~/.config/mise/config.toml" = "~/.dotfiles/mise/config.toml"
"~/.config/mise/mise.lock" = "~/.dotfiles/mise/mise.lock"
"~/.config/nvim" = "~/.dotfiles/nvim"
"~/.config/opencode/AGENTS.md" = "~/.dotfiles/opencode/AGENTS.md"
"~/.config/opencode/cli.json" = "~/.dotfiles/opencode/cli.json"
"~/.config/zed/settings.json" = "~/.dotfiles/zed/settings.json"

[bootstrap.user]
login_shell = "/opt/homebrew/bin/fish"

[bootstrap.hooks.pre-packages]
# Enables Touch ID for `sudo` commands
run = """
if ! sudo test -f /etc/pam.d/sudo_local; then
  sudo cp /etc/pam.d/sudo_local.template /etc/pam.d/sudo_local
fi
if ! sudo grep -Eq '^[[:space:]]*auth[[:space:]]+sufficient[[:space:]]+pam_tid[.]so' /etc/pam.d/sudo_local; then
  printf 'auth       sufficient     pam_tid.so\\n' | sudo tee -a /etc/pam.d/sudo_local >/dev/null
fi
"""

[bootstrap.macos.dock]
autohide = true

[bootstrap.macos.finder]
show_pathbar = true

[bootstrap.macos.keyboard]
key_repeat = 1
initial_key_repeat = 10

[bootstrap.macos.trackpad]
tap_to_click = true

[bootstrap.macos.defaults]
NSGlobalDomain = { AppleShowAllExtensions = true }
"com.apple.dock" = { tilesize = 34.0, autohide-delay = 0.0, autohide-time-modifier = 0 }
