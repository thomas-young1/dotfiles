git:
  pagers:
    - colorArg: always
      pager: delta --dark --side-by-side --paging=never
os:
  editPreset: zed
customCommands:
  - key: "<c-u>"
    context: "commits"
    command: "git reset --soft HEAD~"
  - key: "<c-e>"
    context: "files"
    command: "{ git diff --name-only --diff-filter=AM; git ls-files --others --exclude-standard; } | xargs -o zed"
